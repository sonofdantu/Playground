# Intended runtime config for Qwen/Qwen3-VL-2B-Instruct once exported to ORT GenAI.
backend=ort-genai
model_dir=models/qwen3-vl-2b-instruct
execution_provider=cpu
prompt=Describe the scene accurately and concisely. Mention visible objects, setting, and notable actions. Do not speculate.
max_new_tokens=160
temperature=0.2
top_p=0.9
deterministic=true
emit_json=true

