# Experimental ORT GenAI package assembled from Qwen3.5-2B ONNX-OPT q4f16 graphs.
backend=ort-genai
model_dir=models/qwen3.5-2b-onnxopt-q4f16
execution_provider=cpu
prompt=Describe the visible scene in one concise sentence. Mention only clear objects and actions.
max_new_tokens=48
temperature=0.6
top_p=0.95
deterministic=false
emit_json=true
